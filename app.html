<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dashcam - Monitor</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("OZNLclrooFqNEEqWR"); 
        })();
    </script>
    <style>
        body { background-color: #0f111a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .camera-container { width: 100%; max-width: 800px; aspect-ratio: 4/3; background: black; border: 3px solid lime; border-radius: 15px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .controls { margin-top: 20px; width: 100%; max-width: 400px; background: #1e2126; padding: 20px; border-radius: 10px; text-align: center; }
        .btn-alert { background: orange; color: black; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .status { color: lime; font-weight: bold; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚗 AI Dashcam Monitor</h2>
        <button onclick="window.location.href='index.html'" style="background:none; border:1px solid #444; color:white; padding:5px 10px; border-radius:5px;">Logout</button>
    </div>

    <div class="camera-container">
        <video id="webcam" autoplay muted playsinline></video>
    </div>

    <div class="controls">
        <span class="status" id="status-text">SYSTEM: ACTIVE</span>
        <button class="btn-alert" onclick="triggerManualAlert()">Send Test Alert Email</button>
    </div>

    <script>
        const video = document.getElementById('webcam');

        // Access the mobile/desktop camera
        async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user" } 
        });
        
        // 1. Connect the camera stream to the video element
        video.srcObject = stream;
        
        // 2. This part ensures the video actually starts playing
        video.onloadedmetadata = () => {
            video.play();
        };

        document.getElementById("status-text").innerText = "SYSTEM: ACTIVE";
        document.getElementById("status-text").style.color = "lime";
        
    } catch (err) {
        document.getElementById("status-text").innerText = "SYSTEM: CAMERA ERROR";
        document.getElementById("status-text").style.color = "red";
        console.error("Camera Error:", err);
    }
}

        function triggerManualAlert() {
            const templateParams = {
                to_email: "harshareddy4489@gmail.com", // You can change this to any email
                otp: "DROWSINESS DETECTED!"
            };

            emailjs.send('service_i0v4u5c', 'template_i0kie3b', templateParams)
                .then(() => alert("Emergency Email Sent!"))
                .catch((err) => alert("Email failed. Check console."));
        }

        // Start camera on load
        window.onload = initCamera;
    </script>
</body>
</html>
