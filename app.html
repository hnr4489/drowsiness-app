<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure OTP Login - AI Dashcam</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function() { emailjs.init("OZNLclrooFqNEEqWR"); })();
    </script>
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e2126; padding: 40px; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); text-align: center; width: 350px; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #444; border-radius: 5px; background: #2a2d35; color: white; }
        button { width: 100%; padding: 12px; background: lime; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #error-msg, #success-msg { display: none; margin-top: 15px; font-size: 0.9rem; padding: 10px; border-radius: 5px; }
        #error-msg { color: #ff4c4c; background: rgba(255, 76, 76, 0.1); border: 1px solid #ff4c4c; }
        #success-msg { color: lime; background: rgba(0, 255, 0, 0.1); border: 1px solid lime; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🚗 AI Dashcam Login</h2>
        <div id="email-section">
            <input type="email" id="email" placeholder="Enter your Email" required>
            <button onclick="sendOTP()" id="send-btn">Send OTP</button>
        </div>
        <div id="otp-section" style="display:none;">
            <p style="color: #aaa; font-size: 0.8rem;">Check your inbox for the OTP.</p>
            <input type="text" id="otp-input" placeholder="6-digit code" maxlength="6">
            <button onclick="verifyOTP()">Verify & Login</button>
        </div>
        <p id="error-msg"></p>
        <p id="success-msg"></p>
    </div>

    <script>
        let generatedOTP = "";
        function sendOTP() {
            const email = document.getElementById("email").value;
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert("Invalid Email"); return; }
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById("send-btn").innerText = "Sending...";
            emailjs.send('service_i0v4u5c', 'template_i0kie3b', { to_email: email, otp: generatedOTP })
                .then(() => {
                    document.getElementById("email-section").style.display = "none";
                    document.getElementById("otp-section").style.display = "block";
                    document.getElementById("success-msg").innerText = "✅ OTP Sent!";
                    document.getElementById("success-msg").style.display = "block";
                });
        }
        function verifyOTP() {
            if (document.getElementById("otp-input").value === generatedOTP) {
                localStorage.setItem("isLoggedIn", "true");
                window.location.href = "app.html";
            } else { alert("Wrong OTP"); }
        }
    </script>
</body>
</html>
