<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Drowsiness Detector</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>emailjs.init("OZNLclrooFqNEEqWR");</script>
    <style>
        body { background: #0f0f1a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1a1a2e; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid lime; width: 320px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: lime; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🚗 Login</h2>
        <div id="step1">
            <input type="email" id="email" placeholder="Enter Email">
            <button onclick="sendOTP()">Send OTP</button>
        </div>
        <div id="step2" style="display:none;">
            <input type="text" id="otp-input" placeholder="Enter 6-digit OTP">
            <button onclick="verifyOTP()">Verify & Start</button>
        </div>
    </div>

    <script>
        let correctOTP = "";
        function sendOTP() {
            const email = document.getElementById('email').value;
            correctOTP = Math.floor(100000 + Math.random() * 900000).toString();
            emailjs.send('service_i0v4u5c', 'template_i0kie3b', { to_email: email, otp: correctOTP })
                .then(() => {
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                });
        }
        function verifyOTP() {
            if (document.getElementById('otp-input').value === correctOTP) {
                // IMPORTANT: This sets the permission to enter app.html
                localStorage.setItem("user_authenticated", "true");
                window.location.href = "app.html";
            } else {
                alert("Incorrect OTP!");
            }
        }
    </script>
</body>
</html>
